name: Update

on:
  schedule:
    - cron: "30 01 * * *"
  push:
    branches: [main, "simple", "aws"]

defaults:
  run:
    shell: bash --noprofile --norc -exo pipefail {0}

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com

jobs:
  update-lockfile:
    if: github.repository_owner == 'aarnphm'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # ratchet:actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: rhysd/action-setup-vim@2ab97f992520b094d4243cde0d3173493c811799 # ratchet:rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly

      - timeout-minutes: 5
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/..
          NVIM_APPNAME: ${{ github.event.repository.name }}
        run: |
          nvim --headless "+PackLock" +qa
          test -s nvim-pack-lock.json

      - id: meta
        run: |
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: stefanzweifel/git-auto-commit-action@3ea6ae190baf489ba007f7c92608f33ce20ef04a # ratchet:stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore(lockfile): auto update nvim-pack-lock.json [${{ steps.meta.outputs.sha }}]"
          commit_user_name: ${{ env.GIT_AUTHOR_NAME }}
          commit_user_email: ${{ env.GIT_AUTHOR_EMAIL }}
          commit_author: ${{ env.GIT_AUTHOR_NAME }} <${{ env.GIT_AUTHOR_EMAIL }}>
          file_pattern: "nvim-pack-lock.json"
          commit_options: "--signoff"
